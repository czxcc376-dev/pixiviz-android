name: Worker

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Sync runtime secrets
        if: ${{ secrets.WORKER_ACCESS_KEY != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_ACCESS_KEY: ${{ secrets.WORKER_ACCESS_KEY }}
          PIXIV_CLIENT_ID: ${{ secrets.PIXIV_CLIENT_ID }}
          PIXIV_CLIENT_SECRET: ${{ secrets.PIXIV_CLIENT_SECRET }}
        run: |
          set -e
          printf '%s' "$WORKER_ACCESS_KEY" | npx wrangler secret put WORKER_ACCESS_KEY
          if [ -n "$PIXIV_CLIENT_ID" ]; then printf '%s' "$PIXIV_CLIENT_ID" | npx wrangler secret put CLIENT_ID; fi
          if [ -n "$PIXIV_CLIENT_SECRET" ]; then printf '%s' "$PIXIV_CLIENT_SECRET" | npx wrangler secret put CLIENT_SECRET; fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
